<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Upload</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffffff;
      color: #333;
      display: flex;
      height: 100vh;
    }

    /* Left: Upload Form */
    .upload-section {
      flex: 1;
      padding: 40px;
      box-sizing: border-box;
      border-right: 1px solid #ddd;
    }

    h2 {
      margin-bottom: 20px;
    }

    input[type="file"] {
      margin-bottom: 20px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 100%;
    }

    button {
      background-color: #10a37f;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0e8f72;
    }

    /* Right: Response Display */
    .response-section {
      flex: 2;
      padding: 40px;
      overflow-y: auto;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #f2f2f2;
    }

    .error {
      color: red;
    }
  </style>
</head>
<body>

  <div class="upload-section">
    <h2>Upload a CSV File</h2>
    <form id="uploadForm">
      <input type="file" id="fileInput" name="file" accept=".csv" required />
      <br>
      <button type="submit">Upload</button>
    </form>
  </div>

  <div class="response-section" id="response">
    <h2>Data Preview</h2>
    <div id="tableContainer">No data yet.</div>
  </div>

  <script>
    document.getElementById("uploadForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];

      if (!file) {
        alert("Please select a file.");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      try {
        const response = await fetch("http://localhost:5000/upload", {
          method: "POST",
          body: formData
        });

        const result = await response.json();

        // If response contains 'data' (assumed to be a list of dicts), render it as a table
        if (result.data && Array.isArray(result.data)) {
          renderTable(result.data);
        } else {
          document.getElementById("tableContainer").innerHTML = '<p class="error">Unexpected response format</p>';
        }
      } catch (error) {
        document.getElementById("tableContainer").innerHTML = `<p class="error">Error: ${error.message}</p>`;
      }
    });

    function renderTable(data) {
      if (data.length === 0) {
        document.getElementById("tableContainer").innerHTML = "<p>No data available.</p>";
        return;
      }

      const table = document.createElement("table");

      // Create header
      const thead = table.createTHead();
      const headerRow = thead.insertRow();
      Object.keys(data[0]).forEach(key => {
        const th = document.createElement("th");
        th.textContent = key;
        headerRow.appendChild(th);
      });

      // Create rows
      const tbody = table.createTBody();
      data.forEach(row => {
        const tr = tbody.insertRow();
        Object.values(row).forEach(value => {
          const td = tr.insertCell();
          td.textContent = value;
        });
      });

      const container = document.getElementById("tableContainer");
      container.innerHTML = "";
      container.appendChild(table);
    }
  </script>

</body>
</html>
