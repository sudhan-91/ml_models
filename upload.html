<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload File and Prompt</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffffff;
      color: #333;
      display: flex;
      height: 100vh;
    }

    .upload-section {
      flex: 1;
      padding: 40px;
      box-sizing: border-box;
      border-right: 1px solid #ddd;
    }

    h2 {
      margin-bottom: 20px;
    }

    input[type="file"], select {
      margin-bottom: 20px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      background-color: #10a37f;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    .response-section {
      flex: 2;
      padding: 40px;
      overflow-y: auto;
    }

    .error {
      color: red;
    }
  </style>
</head>
<body>

<div class="upload-section">
  <h2>Upload CSV and Prompt</h2>
  <form id="uploadForm">
    <input type="file" id="fileInput" name="file" accept=".csv" required />
    <br>
    <select id="promptInput" required>
      <option value="" disabled selected>Select a prompt...</option>
      <option value="Summary">Summary</option>
      <option value="Analysis">Analysis</option>
      <option value="Insights">Insights</option>
    </select>
    <br>
    <button type="submit">Submit</button>
  </form>
</div>

<div class="response-section" id="response">
  <h2>Response</h2>
  <div id="tableContainer">The processed CSV will be downloaded automatically.</div>
</div>

<script>
  document.getElementById("uploadForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const fileInput = document.getElementById("fileInput");
    const promptInput = document.getElementById("promptInput");
    const file = fileInput.files[0];
    const prompt = promptInput.value.trim();

    if (!file || !prompt) {
      alert("Please provide both a file and a prompt.");
      return;
    }

    const formData = new FormData();
    formData.append("file", file);
    formData.append("prompt", prompt);

    try {
      const response = await fetch("http://localhost:8000/process", {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        throw new Error("Failed to fetch processed CSV.");
      }

      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "result.csv";
      a.click();
      window.URL.revokeObjectURL(url); // Clean up
    } catch (error) {
      document.getElementById("tableContainer").innerHTML = `<p class="error">Error: ${error.message}</p>`;
    }
  });
</script>

</body>
</html>
