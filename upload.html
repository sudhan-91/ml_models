<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload File and Prompt</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffffff;
      color: #333;
      display: flex;
      height: 100vh;
    }

    .upload-section {
      flex: 1;
      padding: 40px;
      box-sizing: border-box;
      border-right: 1px solid #ddd;
    }

    h2 {
      margin-bottom: 20px;
    }

    input[type="file"], textarea {
      margin-bottom: 20px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      width: 100%;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      background-color: #10a37f;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    .response-section {
      flex: 2;
      padding: 40px;
      overflow-y: auto;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #f2f2f2;
    }

    .error {
      color: red;
    }
  </style>
</head>
<body>

  <div class="upload-section">
    <h2>Upload CSV and Prompt</h2>
    <form id="uploadForm">
      <input type="file" id="fileInput" name="file" accept=".csv" required />
      <br>
      <textarea id="promptInput" placeholder="Enter your prompt here..." required></textarea>
      <br>
      <button type="submit">Submit</button>
    </form>
  </div>

  <div class="response-section" id="response">
    <h2>Response</h2>
    <div id="tableContainer">No data yet.</div>
  </div>

  <script>
    document.getElementById("uploadForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const fileInput = document.getElementById("fileInput");
      const promptInput = document.getElementById("promptInput");
      const file = fileInput.files[0];
      const prompt = promptInput.value.trim();

      if (!file || !prompt) {
        alert("Please provide both a file and a prompt.");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);
      formData.append("prompt", prompt);

      try {
        const response = await fetch("http://localhost:8000/process", {
          method: "POST",
          body: formData
        });

        const result = await response.json();

        if (result.data && Array.isArray(result.data)) {
          renderTable(result.data);
        } else {
          document.getElementById("tableContainer").innerHTML = `<p>${result.message || 'No structured data returned.'}</p>`;
        }
      } catch (error) {
        document.getElementById("tableContainer").innerHTML = `<p class="error">Error: ${error.message}</p>`;
      }
    });

    function renderTable(data) {
      if (data.length === 0) {
        document.getElementById("tableContainer").innerHTML = "<p>No data available.</p>";
        return;
      }

      const table = document.createElement("table");

      const thead = table.createTHead();
      const headerRow = thead.insertRow();
      Object.keys(data[0]).forEach(key => {
        const th = document.createElement("th");
        th.textContent = key;
        headerRow.appendChild(th);
      });

      const tbody = table.createTBody();
      data.forEach(row => {
        const tr = tbody.insertRow();
        Object.values(row).forEach(value => {
          const td = tr.insertCell();
          td.textContent = value;
        });
      });

      const container = document.getElementById("tableContainer");
      container.innerHTML = "";
      container.appendChild(table);
    }
  </script>

</body>
</html>
